[project]
name = "owl-akrida"
version = "1.0.0"
description = "Load testing tool for Aries agents"
requires-python = ">=3.10"
dependencies = [
    "locust==2.42.2",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]
integration = [
    "aiohttp>=3.9.0",
]
all = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "aiohttp>=3.9.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Monkey-patching ssl:",
]
markers = [
    "integration: marks tests as integration tests requiring Docker",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
